# Root Netlify Configuration for Pooja Patil Developer Portfolio
[build]
  base = "frontend"
  publish = "."

# Production Headers for Security, Performance & Browser Caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-Page Routing fallback if needed
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
