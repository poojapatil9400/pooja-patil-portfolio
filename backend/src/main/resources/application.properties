# ===================================================================
# Spring Boot Portfolio Backend Configuration
# Supports local development and cloud production (Render, Clever Cloud, Aiven)
# ===================================================================

# Application Info
spring.application.name=portfolio-backend
server.port=${PORT:8080}

# MySQL Database DataSource Configuration with Environment Variable Injection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pooja_portfolio?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging
logging.level.root=INFO
logging.level.com.pooja.portfolio=DEBUG
