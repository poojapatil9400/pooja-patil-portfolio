services:
  - type: web
    name: pooja-portfolio-backend
    env: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/portfolio-backend-1.0.0.jar
    healthCheckPath: /api/health
    envVars:
      - key: JPA_DDL_AUTO
        value: update
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
